name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Giá trị placeholder — đủ để lint/typecheck/build chạy được mà không cần
  # secret thật. Không phải giá trị production.
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  NEXT_PUBLIC_ENABLE_AI_SPEECH_COACH: "false"
  NEXT_PUBLIC_MAX_VIDEO_UPLOAD_MB: "200"
  NEXT_PUBLIC_MAX_AUDIO_UPLOAD_MB: "50"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
